<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>음악봇 컨트롤 패널</title>
    <style>
      :root {
        --bg: #1e1f22;
        --panel: #2b2d31;
        --panel2: #313338;
        --text: #f2f3f5;
        --muted: #b5bac1;
        --accent: #5865f2;
        --green: #23a55a;
        --red: #f23f43;
        --border: #3f4147;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Segoe UI", "Malgun Gothic", sans-serif;
        background: var(--bg);
        color: var(--text);
        padding: 22px;
        max-width: 900px;
      }
      h1 { font-size: 20px; margin: 0 0 4px; }
      .sub { color: var(--muted); font-size: 13px; margin-bottom: 18px; }
      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 16px 18px;
        margin-bottom: 16px;
      }
      .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
      .pill {
        display: inline-flex; align-items: center; gap: 8px;
        padding: 6px 14px; border-radius: 999px; font-weight: 600; font-size: 14px;
        background: var(--panel2);
      }
      .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--red); }
      .pill.on .dot { background: var(--green); box-shadow: 0 0 8px var(--green); }
      .spacer { flex: 1; }
      button {
        border: none; border-radius: 8px; padding: 10px 20px; font-size: 15px;
        font-weight: 600; cursor: pointer; color: #fff; transition: filter .15s;
      }
      button:hover { filter: brightness(1.12); }
      button:disabled { opacity: .45; cursor: not-allowed; filter: none; }
      .btn-start { background: var(--green); }
      .btn-stop { background: var(--red); }
      .btn-save { background: var(--accent); padding: 8px 16px; font-size: 14px; }
      label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
      input {
        width: 100%; padding: 9px 11px; border-radius: 7px; font-size: 14px;
        background: var(--panel2); border: 1px solid var(--border); color: var(--text);
      }
      input:focus { outline: none; border-color: var(--accent); }
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      summary { cursor: pointer; color: var(--muted); font-size: 13px; user-select: none; }
      table { width: 100%; border-collapse: collapse; font-size: 14px; }
      th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--border); }
      th { color: var(--muted); font-weight: 600; font-size: 12px; }
      .empty { color: var(--muted); font-size: 14px; padding: 18px 4px; text-align: center; }
      .playing { color: var(--green); }
      .err { color: var(--red); font-size: 13px; margin-top: 10px; min-height: 16px; }
      .badge { font-size: 11px; color: var(--muted); }
      .hint { font-size: 11px; color: var(--muted); margin-top: 6px; }
    </style>
  </head>
  <body>
    <h1>🎵 음악봇 컨트롤 패널</h1>
    <div class="sub">봇을 켜고 끄고, 어느 서버에서 쓰이는지 한눈에 봅니다.</div>

    <div class="card">
      <div class="row">
        <span id="statusPill" class="pill"><span class="dot"></span><span id="statusText">오프라인</span></span>
        <span id="botTag" class="badge"></span>
        <span class="spacer"></span>
        <button id="startBtn" class="btn-start">▶️ 켜기</button>
        <button id="stopBtn" class="btn-stop" disabled>⏹️ 끄기</button>
      </div>
      <div id="err" class="err"></div>
    </div>

    <div class="card">
      <details id="credBox">
        <summary>⚙️ 봇 자격증명 설정 (토큰 / Application ID)</summary>
        <div class="grid" style="margin-top: 12px;">
          <div>
            <label>봇 토큰 (Bot 탭 → Reset Token)</label>
            <input id="token" type="password" placeholder="MTxxxxx.Gxxxxx.xxxxx" />
          </div>
          <div>
            <label>Application ID (General Information)</label>
            <input id="clientId" type="text" placeholder="숫자 18~19자리" />
          </div>
        </div>
        <label>서버 ID (선택 · 넣으면 /셋업 명령어 즉시 등록)</label>
        <input id="guildId" type="text" placeholder="비워두면 전역(최대 1시간)" />
        <div class="row" style="margin-top: 12px;">
          <button id="saveBtn" class="btn-save">💾 저장</button>
          <span id="saveMsg" class="badge"></span>
        </div>
        <div class="hint">토큰은 비밀번호입니다. 이 PC에만 저장되며 외부로 전송되지 않습니다.</div>
      </details>
    </div>

    <div class="card">
      <div class="row" style="margin-bottom: 8px;">
        <strong>🖥️ 사용 중인 서버</strong>
        <span class="spacer"></span>
        <span id="guildCount" class="badge"></span>
      </div>
      <table>
        <thead>
          <tr><th>서버</th><th>멤버</th><th>재생 중</th><th>대기열</th></tr>
        </thead>
        <tbody id="guildBody"></tbody>
      </table>
      <div id="emptyGuilds" class="empty">봇을 켜면 들어가 있는 서버가 여기에 표시됩니다.</div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
